# Mac-specific install config

- link:
    ~/.gnupg/gpg-agent.conf:
      path: configs/gpg-agent.conf
      create: true

- create:
    - ~/.gnupg

# Homebrew casks and formulas (enabled with dotbot-brew plugin)
- brew:
    - 1password-cli
    - direnv
    - entr
    - fd
    - fzf
    - gh
    - ghq
    - git-delta
    - git-lfs
    - go
    - gotop
    - gpg
    - lua
    - neovim
    - ngrok
    - pinentry-mac
    - rbenv
    - ripgrep
    - ruby
    - ruby-build
    - tmux
    - tree
    - vim
    - zoxide
    - zsh-syntax-highlighting
